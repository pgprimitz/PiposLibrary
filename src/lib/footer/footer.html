<footer class="footer">
  <div class="brand">
    <ng-content select="[brand]" />
  </div>

  @if (links().length > 0) {
    <ul class="links">
      @for (link of links(); track link.id) {
        <li>
          <a class="link" [href]="link.href" (click)="select(link)">{{ link.label }}</a>
        </li>
      }
    </ul>
  }

  @if (copyrightText()) {
    <p class="copyright">{{ copyrightText() }}</p>
  }
</footer>

<div class="wrap" [attr.aria-label]="ariaLabel()">
  @if (level() !== null) {
    <span class="level-tag">Nivel {{ level() }}</span>
  }
  <generic-progress
    class="bar"
    [value]="currentXp()"
    [max]="levelXp()"
    [tone]="tone()"
    [label]="caption()"
    [showValue]="true"
  />
</div>

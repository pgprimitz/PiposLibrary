<header class="navbar">
  <div class="row">
    <span class="brand">{{ brandLabel() }}</span>

    <nav class="nav-links" aria-label="Main">
      @for (item of items(); track item.id) {
        <button
          type="button"
          class="nav-item"
          [class.active]="item.id === activeId()"
          (click)="select(item)"
        >
          @if (item.icon) {
            <generic-icon [name]="item.icon" [size]="16" />
          }
          {{ item.label }}
        </button>
      }
    </nav>

    <div class="actions">
      <button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="themeIconLabel()"
        (click)="toggleTheme()"
      >
        <span class="theme-icon" [class.mode-dark]="theme() === 'dark'" [class.mode-light]="theme() === 'light'"></span>
      </button>

      <button
        type="button"
        class="hamburger"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Abrir menú"
        (click)="toggleMobileMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav class="mobile-panel" aria-label="Main mobile">
      @for (item of items(); track item.id) {
        <button
          type="button"
          class="mobile-item"
          [class.active]="item.id === activeId()"
          (click)="select(item)"
        >
          @if (item.icon) {
            <generic-icon [name]="item.icon" [size]="16" />
          }
          {{ item.label }}
        </button>
      }
    </nav>
  }
</header>

<div class="widget" [class.disabled]="disabled()">
  <p class="question" [id]="questionId">{{ question() }}</p>

  <div class="group" role="radiogroup" [attr.aria-labelledby]="questionId">
    @for (option of options(); track option.id) {
      <label
        class="row"
        [class.disabled]="isDisabled(option)"
        [class.correct]="resultTone()[option.id] === 'correct'"
        [class.incorrect]="resultTone()[option.id] === 'incorrect'"
      >
        <span class="box" [class.on]="value() === option.id">
          <input
            type="radio"
            [id]="optionId(option)"
            [name]="name"
            [value]="option.id"
            [checked]="value() === option.id"
            [disabled]="isDisabled(option)"
            (change)="select(option)"
          />
          <span class="dot" aria-hidden="true"></span>
        </span>
        <span class="text">{{ option.label }}</span>
      </label>
    }
  </div>
</div>
